<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#230438"/>
      <stop offset="50%" stop-color="#3B0A5E"/>
      <stop offset="100%" stop-color="#140220"/>
    </linearGradient>
    <linearGradient id="cgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C5C0C"/>
    </linearGradient>
    <linearGradient id="creamBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFA826"/>
      <stop offset="50%" stop-color="#E58A13"/>
      <stop offset="100%" stop-color="#B85200"/>
    </linearGradient>
    <filter id="cshadow">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="url(#cbg)"/>
  <circle cx="540" cy="540" r="420" fill="#D4AF37" opacity="0.08"/>
  <circle cx="540" cy="540" r="320" fill="#FFE885" opacity="0.12"/>
  
  <!-- Crown and Heading -->
  <g transform="translate(540, 140)" text-anchor="middle">
    <path d="M -30,-20 L -40,-45 L -18,-32 L 0,-54 L 18,-32 L 40,-45 L 30,-20 Z" fill="url(#cgold)"/>
    <text x="0" y="30" font-family="Cinzel, Georgia, serif" font-size="46" font-weight="bold" fill="url(#cgold)" letter-spacing="4">DUBAI ZAFRANI CREAM</text>
    <text x="0" y="75" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FAF5EE">زعفران سے متاثرہ پریمیم اسکن کیئر فارمولیشن</text>
  </g>

  <!-- Big Central Product Feature Visual -->
  <g transform="translate(390, 360)" filter="url(#cshadow)">
    <!-- Jar -->
    <rect x="0" y="60" width="300" height="200" rx="30" fill="url(#creamBody)" stroke="#FFFFFF" stroke-width="4"/>
    <g fill="#FFFDF0" opacity="0.85">
      <circle cx="50" cy="110" r="4"/>
      <circle cx="100" cy="180" r="4.5"/>
      <circle cx="170" cy="120" r="3"/>
      <circle cx="230" cy="150" r="5"/>
      <circle cx="190" cy="210" r="4"/>
    </g>
    <!-- Label -->
    <rect x="20" y="95" width="260" height="125" rx="10" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
    <text x="150" y="135" text-anchor="middle" font-family="Cinzel, serif" font-size="22" font-weight="bold" fill="#AA771C">DUBAI</text>
    <text x="150" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#4A0E78">Zafrani Cream</text>
    <text x="150" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6B21A8">خالص کشمیری و ایرانی زعفران</text>
    <!-- Lid -->
    <rect x="-10" y="20" width="320" height="48" rx="16" fill="#FAF5EE" stroke="#D4AF37" stroke-width="2.5"/>
    <text x="150" y="52" text-anchor="middle" font-family="Cinzel, serif" font-size="18" font-weight="bold" fill="#6B4708">DUBAI LUXURY FORMULA</text>
  </g>

  <!-- Surrounding Saffron Flowers -->
  <g transform="translate(180, 680)">
    <path d="M 0,0 C -30,-50 -20,-100 20,-110 C 50,-100 60,-50 30,0 Z" fill="#9C27B0"/>
    <path d="M 40,0 C 15,-50 30,-105 70,-115 C 100,-105 105,-50 65,0 Z" fill="#7B1FA2"/>
    <path d="M 20,-45 Q 35,-90 55,-105" stroke="#E53935" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 24,-45 Q 45,-85 70,-95" stroke="#D32F2F" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 3 Key Value Props on Bottom -->
  <g transform="translate(140, 780)">
    <g transform="translate(0, 0)" filter="url(#cshadow)">
      <rect x="0" y="0" width="240" height="110" rx="16" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.8"/>
      <text x="120" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#2A0845">خالص زعفران</text>
      <text x="120" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6B21A8">قدرتی اجزاء سے تیار</text>
    </g>
    <g transform="translate(280, 0)" filter="url(#cshadow)">
      <rect x="0" y="0" width="240" height="110" rx="16" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.8"/>
      <text x="120" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#2A0845">تمام جلد کے لیے</text>
      <text x="120" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6B21A8">نرم اور محفوظ دیکھ بھال</text>
    </g>
    <g transform="translate(560, 0)" filter="url(#cshadow)">
      <rect x="0" y="0" width="240" height="110" rx="16" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.8"/>
      <text x="120" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#2A0845">کیش آن ڈیلیوری</text>
      <text x="120" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6B21A8">پورے پاکستان میں</text>
    </g>
  </g>

  <!-- Bottom WhatsApp Bar -->
  <g transform="translate(240, 930)" filter="url(#cshadow)">
    <rect x="0" y="0" width="600" height="74" rx="37" fill="#25D366" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="300" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">WhatsApp آرڈر: 0306-6508319</text>
  </g>
</svg>