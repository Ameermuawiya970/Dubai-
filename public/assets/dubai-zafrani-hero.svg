<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A0329"/>
      <stop offset="30%" stop-color="#2D0848"/>
      <stop offset="70%" stop-color="#3B0A5E"/>
      <stop offset="100%" stop-color="#12011D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#6B4708"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="50%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F5EEDB"/>
    </linearGradient>
    <linearGradient id="creamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFBE3B"/>
      <stop offset="60%" stop-color="#E58A13"/>
      <stop offset="100%" stop-color="#C25E03"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A0E78"/>
      <stop offset="50%" stop-color="#6B1B9A"/>
      <stop offset="100%" stop-color="#4A0E78"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background with warm bokeh & luxury glow -->
  <rect width="1080" height="1080" fill="url(#bgGrad)"/>
  <circle cx="200" cy="300" r="280" fill="#D4AF37" opacity="0.12" filter="url(#glow)"/>
  <circle cx="850" cy="200" r="350" fill="#FFBE3B" opacity="0.10" filter="url(#glow)"/>
  <circle cx="540" cy="800" r="400" fill="#D4AF37" opacity="0.15" filter="url(#glow)"/>

  <!-- Golden sparkles & light beams -->
  <g opacity="0.6">
    <circle cx="120" cy="150" r="3" fill="#FFF3B0"/>
    <circle cx="340" cy="90" r="4" fill="#FFF3B0"/>
    <circle cx="920" cy="120" r="3.5" fill="#FFF3B0"/>
    <circle cx="780" cy="360" r="2.5" fill="#FFF3B0"/>
    <circle cx="180" cy="520" r="3" fill="#FFF3B0"/>
    <circle cx="980" cy="620" r="4" fill="#FFF3B0"/>
  </g>

  <!-- Top Left Splash Banner -->
  <g transform="translate(60, 50)" filter="url(#shadow)">
    <path d="M 0,20 Q 80,-10 220,10 Q 300,20 280,75 Q 250,115 140,110 Q 20,105 0,60 Z" fill="#4A0E78" stroke="#D4AF37" stroke-width="2.5"/>
    <text x="140" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFE885">اب آپ کی جلد بھی ہوگی چمکدار!</text>
    <circle cx="20" cy="25" r="4" fill="#D4AF37"/>
    <circle cx="270" cy="80" r="3" fill="#D4AF37"/>
  </g>

  <!-- Brand Header: Crown + DUBAI Zafrani Cream -->
  <g transform="translate(720, 110)" text-anchor="middle" filter="url(#shadow)">
    <!-- Crown -->
    <path d="M -45,-30 L -55,-65 L -25,-48 L 0,-78 L 25,-48 L 55,-65 L 45,-30 Z" fill="url(#goldGrad)" stroke="#FFE885" stroke-width="1.5"/>
    <circle cx="-55" cy="-68" r="4" fill="#FFE885"/>
    <circle cx="0" cy="-81" r="5" fill="#FFE885"/>
    <circle cx="55" cy="-68" r="4" fill="#FFE885"/>
    
    <!-- Title -->
    <text x="0" y="25" font-family="Cinzel, Georgia, serif" font-size="52" font-weight="800" letter-spacing="4" fill="url(#goldGrad)">DUBAI</text>
    <text x="0" y="75" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#E9D5FF">Zafrani</text>
    <text x="0" y="112" font-family="Georgia, serif" font-size="30" font-weight="600" fill="#FFFFFF" letter-spacing="2">Cream</text>
    
    <!-- Urdu Ribbon -->
    <g transform="translate(0, 135)">
      <path d="M -180,-18 L 180,-18 Q 195,0 180,18 L -180,18 Q -195,0 -180,-18 Z" fill="url(#ribbonGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
      <text x="0" y="7" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFF3B0">قدرتی خوبصورتی کا راز</text>
    </g>
    <!-- Urdu Subtitle -->
    <text x="0" y="188" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#F3E8FF">چمکدار ، نکھری اور بے داغ جلد کے لیے</text>
  </g>

  <!-- Right Side: 4 Benefit Cards -->
  <g transform="translate(560, 360)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="380" height="64" rx="32" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.8"/>
      <circle cx="36" cy="32" r="24" fill="#4A0E78"/>
      <path d="M 36,18 L 39,27 L 48,30 L 39,33 L 36,42 L 33,33 L 24,30 L 33,27 Z" fill="#FFE885"/>
      <text x="350" y="28" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2A0845">جلد کو نکھارے</text>
      <text x="350" y="50" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#6B21A8">قدرتی چمک دے</text>
    </g>
    
    <!-- Card 2 -->
    <g transform="translate(0, 80)" filter="url(#shadow)">
      <rect x="0" y="0" width="380" height="64" rx="32" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.8"/>
      <circle cx="36" cy="32" r="24" fill="#4A0E78"/>
      <path d="M 36,20 C 36,20 44,30 44,36 C 44,40.4 40.4,44 36,44 C 31.6,44 28,40.4 28,36 C 28,30 36,20 36,20 Z" fill="#FFE885"/>
      <text x="350" y="28" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2A0845">گہری نمی فراہم کرے</text>
      <text x="350" y="50" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#6B21A8">خشکی دور کرے</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(0, 160)" filter="url(#shadow)">
      <rect x="0" y="0" width="380" height="64" rx="32" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.8"/>
      <circle cx="36" cy="32" r="24" fill="#4A0E78"/>
      <circle cx="36" cy="30" r="12" fill="none" stroke="#FFE885" stroke-width="2.5"/>
      <circle cx="36" cy="27" r="5" fill="#FFE885"/>
      <text x="350" y="28" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2A0845">داغ دھبے کم کرے</text>
      <text x="350" y="50" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#6B21A8">رنگت صاف کرے</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(0, 240)" filter="url(#shadow)">
      <rect x="0" y="0" width="380" height="64" rx="32" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.8"/>
      <circle cx="36" cy="32" r="24" fill="#4A0E78"/>
      <path d="M 36,40 C 30,34 30,24 44,24 C 44,38 36,40 36,40 Z" fill="#FFE885"/>
      <text x="350" y="28" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2A0845">قدرتی اجزاء سے تیار</text>
      <text x="350" y="50" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#6B21A8">ہر قسم کی جلد کے لیے محفوظ</text>
    </g>
  </g>

  <!-- Left Side: Radiance Model Silhouette & Saffron Florals -->
  <g transform="translate(120, 280)">
    <!-- Soft glowing aura -->
    <circle cx="160" cy="220" r="180" fill="#FFE885" opacity="0.25" filter="url(#glow)"/>
    <!-- Perfume / Attar Bottle -->
    <g transform="translate(30, 160)" filter="url(#shadow)">
      <rect x="0" y="60" width="70" height="120" rx="8" fill="#D4AF37" opacity="0.85" stroke="#FFE885" stroke-width="2"/>
      <rect x="15" y="40" width="40" height="20" fill="#AA771C"/>
      <circle cx="35" cy="25" r="18" fill="url(#goldGrad)" stroke="#FFE885" stroke-width="2"/>
    </g>
    <!-- Model Illustration Representation with glowing skin -->
    <g transform="translate(130, 80)" filter="url(#shadow)">
      <!-- Hair -->
      <path d="M -40,30 C -90,60 -80,180 -40,240 C 0,260 60,260 90,210 C 130,150 110,60 70,30 C 50,10 0,0 -40,30 Z" fill="#201018"/>
      <!-- Face / Glowing Skin -->
      <path d="M -20,60 C -45,100 -30,160 0,190 C 30,190 55,140 45,80 C 40,50 10,40 -20,60 Z" fill="#FDE2CD"/>
      <!-- Cheek Glow / Radiance -->
      <ellipse cx="20" cy="110" rx="28" ry="20" fill="#FFB787" opacity="0.6" filter="url(#glow)"/>
      <circle cx="25" cy="105" r="5" fill="#FFFFFF" opacity="0.75"/>
      <!-- Elegant Pose Arm / Hand Touching Cheek -->
      <path d="M -10,140 C -15,120 -5,105 10,105 C 18,105 20,115 15,130 Z" fill="#F8D3B8"/>
      <!-- Sparkle on cheek -->
      <path d="M 25,95 L 28,102 L 35,105 L 28,108 L 25,115 L 22,108 L 15,105 L 22,102 Z" fill="#FFE885" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Center-Bottom: Luxury Product Jar -->
  <g transform="translate(340, 680)" filter="url(#shadow)">
    <!-- Jar Glass Body -->
    <rect x="0" y="80" width="280" height="170" rx="26" fill="url(#creamGrad)" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Gold Flecks inside jar -->
    <g fill="#FFFDF0" opacity="0.8">
      <circle cx="45" cy="130" r="3.5"/>
      <circle cx="85" cy="190" r="4"/>
      <circle cx="140" cy="140" r="3"/>
      <circle cx="210" cy="160" r="4.5"/>
      <circle cx="175" cy="210" r="3.5"/>
      <circle cx="240" cy="120" r="2.5"/>
      <circle cx="95" cy="115" r="3"/>
    </g>
    <!-- Jar Label (White/Gold banner) -->
    <rect x="15" y="115" width="250" height="95" rx="8" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.8"/>
    <!-- Crown on Label -->
    <path d="M 125,124 L 120,132 L 130,132 L 133,126 L 136,132 L 146,132 L 141,124 Z" fill="url(#goldGrad)"/>
    <text x="133" y="148" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="18" font-weight="bold" fill="#AA771C">DUBAI</text>
    <text x="133" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#4A0E78">Zafrani</text>
    <text x="133" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333333">Cream</text>
    <text x="133" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#AA771C">0306-6508319</text>
    
    <!-- Jar Lid (Premium White & Gold Rim) -->
    <rect x="-10" y="45" width="300" height="42" rx="14" fill="#FAF5EE" stroke="#D4AF37" stroke-width="2"/>
    <rect x="10" y="55" width="260" height="2" fill="url(#goldGrad)"/>
    <text x="140" y="72" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="15" font-weight="bold" fill="#6B4708">DUBAI ZAFRANI CREAM</text>
  </g>

  <!-- Saffron Flowers & Saffron Strands around Jar -->
  <g transform="translate(180, 830)">
    <!-- Purple Crocus Petals -->
    <path d="M 0,0 C -25,-40 -15,-80 15,-90 C 40,-80 45,-40 20,0 Z" fill="#8E24AA" stroke="#4A148C" stroke-width="1.5"/>
    <path d="M 30,0 C 10,-40 20,-85 50,-95 C 75,-85 80,-40 50,0 Z" fill="#7B1FA2" stroke="#4A148C" stroke-width="1.5"/>
    <path d="M -20,0 C -45,-30 -40,-75 -10,-80 C 15,-75 10,-30 -5,0 Z" fill="#9C27B0" stroke="#4A148C" stroke-width="1.5"/>
    <!-- Red Saffron Threads -->
    <path d="M 15,-40 Q 25,-75 40,-85" stroke="#E53935" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 18,-40 Q 32,-70 52,-78" stroke="#D32F2F" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 12,-40 Q 10,-70 18,-88" stroke="#FF5252" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Right: Pure Saffron Badge -->
  <g transform="translate(730, 740)" filter="url(#shadow)">
    <path d="M 0,0 C 30,-30 150,-30 180,0 C 190,35 150,75 90,85 C 30,75 -10,35 0,0 Z" fill="#4A0E78" stroke="#D4AF37" stroke-width="2.5"/>
    <text x="90" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFE885">خالص زعفران</text>
    <text x="90" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#F3E8FF">اور قدرتی اجزاء سے تیار</text>
  </g>

  <!-- 100% Dubai Quality Stamp -->
  <g transform="translate(950, 830)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="54" fill="url(#goldGrad)" stroke="#FFF3B0" stroke-width="2"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#FFFFFF" stroke-dasharray="4,4" stroke-width="1.5"/>
    <!-- Small Crown -->
    <path d="M -12,-26 L -16,-34 L -8,-30 L 0,-38 L 8,-30 L 16,-34 L 12,-26 Z" fill="#2A0845"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Cinzel, serif" font-size="16" font-weight="bold" fill="#1A0329">DUBAI</text>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A0329">کوالٹی کی</text>
    <text x="0" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A0329">100% ضمانت</text>
  </g>

  <!-- Bottom Bar: WhatsApp Call to Action -->
  <g transform="translate(0, 970)" filter="url(#shadow)">
    <rect x="0" y="0" width="1080" height="110" fill="#2A0845" stroke="#D4AF37" stroke-width="3"/>
    
    <!-- WhatsApp Icon & Urdu Call to Action -->
    <g transform="translate(60, 25)">
      <circle cx="30" cy="30" r="28" fill="#25D366" stroke="#FFFFFF" stroke-width="2"/>
      <!-- WhatsApp Phone Glyph -->
      <path d="M 22,20 C 20,22 20,26 23,31 C 26,36 30,39 34,40 C 37,41 39,39 40,37 C 41,35 39,34 37,33 C 35,32 34,32 33,34 C 32,35 31,35 30,34 C 28,32 27,31 25,29 C 24,27 25,26 26,25 C 27,24 27,23 26,21 C 25,19 23,19 22,20 Z" fill="#FFFFFF"/>
      <text x="75" y="26" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFF3B0">ابھی آرڈر کریں</text>
      <text x="75" y="52" font-family="Arial, sans-serif" font-size="18" fill="#E9D5FF">اور اپنی جلد کو نئی زندگی دیں</text>
    </g>

    <!-- Phone Number Pill -->
    <g transform="translate(680, 25)">
      <rect x="0" y="0" width="340" height="60" rx="30" fill="url(#goldGrad)" stroke="#FFF3B0" stroke-width="2"/>
      <circle cx="35" cy="30" r="18" fill="#2A0845"/>
      <path d="M 28,24 C 27,25 27,28 30,32 C 32,35 35,37 38,38 C 40,38 41,37 42,35 C 41,34 40,34 38,33 C 37,34 36,34 35,33 C 33,32 32,31 31,30 C 30,28 31,28 32,27 C 31,26 30,24 28,24 Z" fill="#FFE885"/>
      <text x="190" y="40" text-anchor="middle" font-family="Cinzel, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1A0329" letter-spacing="1">0306-6508319</text>
    </g>
  </g>
</svg>